server {
    listen 80;
    server_name itool.lrdzero.uk;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://itool.lrdzero.uk$request_uri; }
}
server {
    listen 443 ssl;
    server_name itool.lrdzero.uk;
    ssl_certificate /etc/letsencrypt/live/itools-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itools-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 32k;
    add_header Referrer-Policy no-referrer always;
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
